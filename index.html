<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCG-Matrix Erfassung</title>
    <style>
        :root {
            --bg-anthrazit: #212121;
            --card-bg: #2d2d2d;
            --text-main: #f5f5f5;
            --karcher-gelb: #FFED00;
            --input-bg: #1a1a1a;
            --border-color: #444;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-anthrazit);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border-top: 5px solid var(--karcher-gelb);
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: var(--karcher-gelb);
            margin-top: 0;
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        p.desc {
            font-size: 0.9rem;
            color: #bbb;
            margin-bottom: 25px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 550px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--karcher-gelb);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"] {
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            font-size: 1rem;
            text-align: right;
            font-family: monospace;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--karcher-gelb);
            outline: none;
            box-shadow: 0 0 5px rgba(255, 237, 0, 0.4);
        }
        .btn-submit {
            margin-top: 25px;
            background-color: var(--karcher-gelb);
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #e5d400;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 BCG-Matrix: Relativer Marktanteil & Marktwachstum</h2>
        <p class="desc">Analyse der Produktpositionierung und Portfolio-Steuerung im Markt.</p>
        
        <form id="bcgForm">
            <div class="grid">
                <div class="form-group">
                    <label for="eigenUmsatz">Eigener Umsatz (€)</label>
                    <input type="text" id="eigenUmsatz" value="525000" data-type="currency">
                </div>
                <div class="form-group">
                    <label for="wettbewerbUmsatz">Umsatz größter Wettbewerber (€)</label>
                    <input type="text" id="wettbewerbUmsatz" value="1430000" data-type="currency">
                </div>
                <div class="form-group">
                    <label for="marktVorjahr">Marktvolumen Vorjahr (€)</label>
                    <input type="text" id="marktVorjahr" value="1008000000" data-type="currency">
                </div>
                <div class="form-group">
                    <label for="marktAktuell">Marktvolumen aktuelles Jahr (€)</label>
                    <input type="text" id="marktAktuell" value="1100000000" data-type="currency">
                </div>
            </div>
            <button type="submit" class="btn-submit">Werte übernehmen & Berechnen</button>
        </form>
    </div>

    <script>
        // Funktion zur Formatierung im buchhalterischen Layout (de-DE)
        function formatNumber(value) {
            let cleanVal = value.toString().replace(/[^\d,.-]/g, '');
            cleanVal = cleanVal.replace(/\./g, '').replace(',', '.');
            let num = parseFloat(cleanVal);
            if (isNaN(num)) num = 0;
            
            return new Intl.NumberFormat('de-DE', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(num);
        }

        const inputs = document.querySelectorAll('input[data-type="currency"]');
        
        inputs.forEach(input => {
            // Initial beim Laden formatieren
            input.value = formatNumber(input.value);

            // Beim Reinklicken in das Feld für einfache Bearbeitung aufbereiten
            input.addEventListener('focus', function() {
                let raw = this.value.replace(/\./g, '').replace(',', '.');
                let num = parseFloat(raw);
                this.value = isNaN(num) ? '' : num.toString().replace('.', ',');
                this.select();
            });

            // Beim Verlassen des Feldes wieder ins buchhalterische Format konvertieren
            input.addEventListener('blur', function() {
                this.value = formatNumber(this.value);
            });
        });

        document.getElementById('bcgForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Formulardaten erfolgreich im buchhalterischen Format verarbeitet.');
        });
    </script>
</body>
</html>
